name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build và test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Chuẩn bị Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kiểm tra migration không bị sửa sau khi merge
        run: |
          # Flyway lưu checksum: sửa một migration đã chạy sẽ làm hỏng mọi môi trường
          # đã áp dụng nó. Chặn ngay ở PR thay vì để phát hiện lúc deploy.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only --diff-filter=M \
              origin/${{ github.base_ref }}...HEAD \
              -- 'core/src/main/resources/db/migration/*.sql')
            if [ -n "$CHANGED" ]; then
              echo "::error::Migration da merge bi sua doi:"
              echo "$CHANGED"
              echo "Viet migration moi thay vi sua file cu."
              exit 1
            fi
          fi

      - name: Build và test
        # Testcontainers dùng Docker có sẵn trên runner
        run: ./gradlew build --no-daemon

      - name: Đăng báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-test
          # Mỗi module có báo cáo riêng: app-public/, app-admin/
          path: '*/build/reports/tests/test/'
          retention-days: 7
