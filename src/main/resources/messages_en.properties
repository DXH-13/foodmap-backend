# Error messages and display strings — English.
#
# Key convention: namespace.subject.action|state — see the i18n-workflow skill.
# Every key here must also exist in messages_vi.properties.

# ── common ──
common.error.internal=Something went wrong. Please try again later.
common.error.validation=The submitted data is invalid.
common.error.unauthorized=You need to sign in to do this.
common.error.forbidden=You do not have permission to do this.
common.error.not_found=The requested resource was not found.
common.error.rate_limited=You are doing that too often. Please try again in a few minutes.

# ── auth ──
auth.error.invalid_credentials=Incorrect email or password.
auth.error.email_already_exists=This email is already registered.
auth.error.email_not_verified=Please verify your email before doing this.
auth.error.invalid_token=Your session is invalid or has expired.
auth.error.token_expired=Your session has expired. Please sign in again.
auth.error.reset_token_invalid=This password reset link is invalid or has already been used.
auth.error.reset_token_expired=This password reset link has expired. Please request a new one.
auth.error.weak_password=Password must be at least 8 characters and contain both letters and digits.
auth.message.reset_email_sent=If this email is registered, we have sent password reset instructions.

# ── place ──
place.error.not_found=Place not found.
place.error.radius_out_of_range=Search radius must be between {0}m and {1}m.
place.error.invalid_coordinates=Invalid coordinates.
place.error.slug_exists=Another place already uses this slug.
place.error.vi_translation_required=A Vietnamese name is required for every place.

# ── review ──
review.error.not_found=Review not found.
review.error.rating_required=Please select a rating.
review.error.too_many_images=A review can include at most {0} images.
review.error.too_many_videos=A review can include at most {0} video.
review.error.moderation_note_required=A reason is required when rejecting a review.
review.error.already_moderated=This review has already been handled by someone else. Please reload.
review.error.not_own_review=You can only edit or delete your own review.

# ── feedback ──
feedback.error.not_found=Feedback not found.
feedback.error.already_open=You have already reported this issue; we are working on it.
feedback.error.duplicate_place_required=Please select the duplicate place.

# ── visit ──
visit.error.too_far=You need to be near the place to check in. You are currently {0}m away.
visit.error.already_today=You have already checked in at this place today.
visit.error.location_required=Your current location is required to check in.

# ── media ──
media.error.not_found=File not found.
media.error.unsupported_type=This file format is not supported.
media.error.too_large=The file exceeds the maximum allowed size.
media.error.video_too_long=Video must not be longer than {0} seconds.
media.error.upload_not_confirmed=The file upload has not completed.

# ── chat ──
chat.error.rate_limited=You have sent too many messages. Please try again in {0} minutes.
chat.error.service_unavailable=The assistant is busy right now. Please try again in a few minutes.
chat.message.no_results=I could not find any matching places. Try widening the area or changing the criteria.

# ── notification ──
notification.review_approved.title=Your review was approved
notification.review_rejected.title=Your review was not approved
notification.feedback_resolved.title=Your report has been handled
notification.new_place_nearby.title=A new place opened near you
notification.place_updated.title=A place you follow was updated
notification.system_announcement.title=Announcement from FoodMap

# ── email ──
email.verify.subject=Verify your FoodMap account
email.reset_password.subject=Reset your FoodMap password
