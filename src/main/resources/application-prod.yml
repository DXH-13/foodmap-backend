# Production.
#
# Mọi bí mật lấy từ secret manager của nền tảng triển khai, KHÔNG từ file .env.
# JWT_SECRET của prod phải KHÁC dev — dùng chung thì token dev sẽ hợp lệ ở prod.

spring:
  datasource:
    hikari:
      maximum-pool-size: 20

foodmap:
  cors:
    allowed-origins:
      - https://admin.foodmap.vn

springdoc:
  # Không phơi Swagger UI ra internet ở production
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.foodmap: INFO
