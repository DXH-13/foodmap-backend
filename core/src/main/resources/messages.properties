# Thông báo lỗi và nội dung hiển thị — TIẾNG VIỆT (ngôn ngữ mặc định).
#
# ⚠️ Vì sao tên file là `messages.properties` chứ không phải `messages_vi.properties`:
# Spring Boot chỉ tạo bean MessageSource khi tìm thấy đúng file `<basename>.properties`.
# Thiếu nó thì mọi lần tra cứu chuỗi đều trả về chính cái key — lỗi âm thầm, chỉ lộ ra
# khi nhìn thấy "place.error.not_found" hiện lên màn hình người dùng.
#
# Quy ước key: namespace.subject.action|state — xem skill i18n-workflow ở repo cha.
# Thêm key ở đây BẮT BUỘC thêm cả ở messages_en.properties.

