# Cấu hình DÙNG CHUNG cho mọi app của FoodMap.
#
# Không phải `application.yml`: core là thư viện, không tự khởi động được. Mỗi app nạp
# file này bằng `spring.config.import: classpath:foodmap-core.yml` trong application.yml
# của mình, rồi ghi đè phần riêng (cổng, connection pool, Flyway, CORS).
#
# Thứ tự ưu tiên: application.yml của app THẮNG file này. Profile riêng
# (application-local.yml, -dev, -prod) thắng cả hai.
#
# KHÔNG đặt `spring.profiles.active` hay `spring.profiles.default` ở đây —
# Spring Boot cấm khai profile trong file được import.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:foodmap}
    username: ${POSTGRES_USER:foodmap}
    password: ${POSTGRES_PASSWORD:foodmap}
    hikari:
      # Kích thước pool do TỪNG APP tự khai — đó là một trong những lý do tách tiến trình.
      connection-timeout: 5000

  jpa:
    # Lược đồ do Flyway quản lý. KHÔNG bao giờ đổi thành update hay create.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    # `enabled` do TỪNG APP tự khai. Chỉ đúng MỘT app được bật, nếu không hai tiến trình
    # sẽ tranh nhau bảng flyway_schema_history và cái khởi động sau sẽ chết.
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Cố ý KHÔNG chỉnh Jackson: mặc định của Boot đã trả thời gian dạng ISO-8601,
  # và giữ nguyên field null trong JSON. Hợp đồng API khai nhiều field `nullable`,
  # nên field null phải CÓ MẶT với giá trị null chứ không được biến mất.

  threads:
    virtual:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

foodmap:
  jwt:
    # ⚠️ Bắt buộc override ở mọi môi trường ngoài local. Sinh bằng: openssl rand -base64 48
    # Hai app PHẢI dùng chung secret: token cấp ở app này phải đọc được ở app kia.
    secret: ${JWT_SECRET:doi-gia-tri-nay-thanh-chuoi-ngau-nhien-it-nhat-32-ky-tu}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    issuer: foodmap

  cors:
    # Mỗi app tự khai origin của client mà nó phục vụ. Rỗng ở đây là mặc định an toàn —
    # và tránh NPE nếu một app quên khai (WebConfig đọc thẳng danh sách này).
    allowed-origins: []

  geo:
    default-radius-meters: 2000
    min-radius-meters: 100
    max-radius-meters: 50000
    # Bán kính tối đa cho phép ghi nhận một lượt đến (FR-VISIT-02)
    visit-max-distance-meters: 200

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9002}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:foodmap-media}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}

  chat:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5}
    max-messages-per-hour: 30

logging:
  level:
    root: INFO
    com.foodmap: DEBUG
